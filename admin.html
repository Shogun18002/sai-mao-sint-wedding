<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Content Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0f0f13;
            --card-bg: #18181f;
            --accent: #ff8c00;
            --text-light: #f0f0f0;
            --text-dim: #a0a0a0;
            --border: #2a2a35;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        h1 {
            color: var(--accent);
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #ff6b35;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #0d0d11;
            border: 1px solid var(--border);
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .hidden { display: none; }
        .row {
            display: flex;
            gap: 15px;
        }
        .row .form-group { flex: 1; }
        #auth-card {
            max-width: 400px;
            margin: 100px auto;
        }
        .status-msg {
            margin-top: 10px;
            text-align: center;
            font-size: 0.9rem;
        }
        input[type="file"] {
            padding: 8px;
            background: #121217;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- LOGIN SCREEN -->
    <div id="auth-card" class="card">
        <h1>Admin Access</h1>
        <div class="form-group">
            <input type="text" id="login-user" placeholder="Username">
        </div>
        <div class="form-group">
            <input type="password" id="login-pass" placeholder="Password">
        </div>
        <button onclick="handleLogin()">Sign In</button>
        <div id="login-status" class="status-msg"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1>Story Content Manager</h1>
            <button onclick="handleLogout()" style="width:auto; padding:8px 16px; background:#e63946; color:white;">Logout</button>
        </div>

        <!-- EDIT SECTION TEXT -->
        <div class="card">
            <h2>Edit Section Letter & Details</h2>
            <div class="form-group">
                <select id="section-select" onchange="loadSectionData()">
                    <option value="">Select Timeline Event...</option>
                </select>
            </div>
            <div class="form-group">
                <input type="text" id="sec-title" placeholder="Event Title (e.g., 1st Anniversary)">
            </div>
            <div class="form-group">
                <input type="text" id="sec-subtitle" placeholder="Subtitle (e.g., One Year of Love)">
            </div>
            <div class="form-group">
                <textarea id="sec-letter" placeholder="Write letter text here..."></textarea>
            </div>
            <button onclick="saveSection()">Update Section Letter</button>
            <div id="sec-status" class="status-msg"></div>
        </div>

        <!-- UPLOAD PHOTO FILE -->
        <div class="card">
            <h2>Upload Photo to Section</h2>
            <div class="form-group">
                <select id="photo-section-select">
                    <option value="">Select Section for Photo...</option>
                </select>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Select Local Image File</label>
                    <input type="file" id="photo-file-input" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Position Number</label>
                    <input type="number" id="photo-pos" placeholder="Photo Position (1-3 or 1-20)">
                </div>
            </div>
            <div class="form-group">
                <input type="text" id="photo-caption" placeholder="Photo Caption (optional)">
            </div>
            <button id="upload-btn" onclick="uploadAndSavePhoto()">Upload & Save Photo</button>
            <div id="photo-status" class="status-msg"></div>
        </div>
    </div>

</div>

<script>
    const SUPABASE_URL = 'https://ejjqaxlwkbcfllggonff.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqanFheGx3a2JjZmxsZ2dvbmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA1OTAwNjEsImV4cCI6MjA1NjE2NjA2MX0.97bT-2s_K-32j2Y3VInO1C9I0Pqg1O-6s8x1y6z2G48';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function handleLogin() {
        const u = document.getElementById('login-user').value.trim();
        const p = document.getElementById('login-pass').value.trim();
        const status = document.getElementById('login-status');
        status.style.color = '#ff6b35';
        status.innerText = 'Checking credentials...';

        try {
            const { data, error } = await db.from('admin_users').select('*').eq('username', u).eq('password', p);
            if (error) throw error;

            if (data && data.length > 0) {
                document.getElementById('auth-card').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                initDashboard();
            } else {
                status.innerText = 'Invalid username or password.';
            }
        } catch (err) {
            status.innerText = 'Error: ' + err.message;
        }
    }

    function handleLogout() {
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('auth-card').classList.remove('hidden');
    }

    async function initDashboard() {
        const { data: sections } = await db.from('story_sections').select('*').order('section_order', { ascending: true });
        
        const secSelect = document.getElementById('section-select');
        const photoSecSelect = document.getElementById('photo-section-select');
        
        secSelect.innerHTML = '<option value="">Select Timeline Event...</option>';
        photoSecSelect.innerHTML = '<option value="">Select Section for Photo...</option>';

        if (sections) {
            sections.forEach(s => {
                const opt = `<option value="${s.id}">${s.section_order}. ${s.title}</option>`;
                secSelect.innerHTML += opt;
                photoSecSelect.innerHTML += opt;
            });
        }
    }

    async function loadSectionData() {
        const id = document.getElementById('section-select').value;
        if (!id) return;

        const { data } = await db.from('story_sections').select('*').eq('id', id).single();
        if (data) {
            document.getElementById('sec-title').value = data.title || '';
            document.getElementById('sec-subtitle').value = data.subtitle || '';
            document.getElementById('sec-letter').value = data.letter_text || '';
        }
    }

    async function saveSection() {
        const id = document.getElementById('section-select').value;
        const status = document.getElementById('sec-status');
        if (!id) return alert('Select an event first.');

        const title = document.getElementById('sec-title').value;
        const subtitle = document.getElementById('sec-subtitle').value;
        const letter_text = document.getElementById('sec-letter').value;

        const { error } = await db.from('story_sections').update({ title, subtitle, letter_text }).eq('id', id);
        if (error) {
            status.style.color = '#ff4d4d';
            status.innerText = error.message;
        } else {
            status.style.color = '#4efa7b';
            status.innerText = 'Section updated successfully!';
            setTimeout(() => status.innerText = '', 3000);
        }
    }

    async function uploadAndSavePhoto() {
        const section_id = document.getElementById('photo-section-select').value;
        const fileInput = document.getElementById('photo-file-input');
        const position_num = parseInt(document.getElementById('photo-pos').value);
        const caption = document.getElementById('photo-caption').value;
        const status = document.getElementById('photo-status');
        const btn = document.getElementById('upload-btn');

        if (!section_id || !fileInput.files[0] || isNaN(position_num)) {
            return alert('Please select a section, pick an image file, and set a position number.');
        }

        const file = fileInput.files[0];
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
        const filePath = `uploads/${fileName}`;

        try {
            btn.disabled = true;
            status.style.color = '#ff8c00';
            status.innerText = 'Uploading image file...';

            const { error: uploadErr } = await db.storage
                .from('wedding-photos')
                .upload(filePath, file);

            if (uploadErr) throw uploadErr;

            const { data: urlData } = db.storage
                .from('wedding-photos')
                .getPublicUrl(filePath);

            const image_url = urlData.publicUrl;

            status.innerText = 'Saving photo reference to database...';

            const { error: dbErr } = await db.from('section_photos').upsert({
                section_id,
                position_num,
                image_url,
                caption
            }, { onConflict: 'section_id,position_num' });

            if (dbErr) throw dbErr;

            status.style.color = '#4efa7b';
            status.innerText = 'Photo uploaded and saved successfully!';
            fileInput.value = '';
            document.getElementById('photo-pos').value = '';
            document.getElementById('photo-caption').value = '';

        } catch (err) {
            status.style.color = '#ff4d4d';
            status.innerText = 'Error: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
