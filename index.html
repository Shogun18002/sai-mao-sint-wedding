<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sai & Mao Sint - Our Journey</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #141419;
            --accent-gold: #d4af37;
            --text-main: #e6e6e6;
            --text-muted: #999999;
            --border-color: #22222a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }

        header {
            text-align: center;
            padding: 80px 20px 40px;
            background: linear-gradient(180deg, #181820 0%, var(--bg-color) 100%);
        }

        header h1 {
            font-size: 2.8rem;
            color: var(--accent-gold);
            margin: 0;
            letter-spacing: 3px;
            font-weight: normal;
        }

        header p {
            color: var(--text-muted);
            font-style: italic;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .timeline-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .section-header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .section-title {
            color: var(--accent-gold);
            font-size: 1.8rem;
            margin: 0;
        }

        .section-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            font-style: italic;
            margin-top: 5px;
        }

        .letter-content {
            font-size: 1.1rem;
            color: #dcdcdc;
            white-space: pre-line;
            margin-bottom: 30px;
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .photo-card {
            background: #0f0f13;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
        }

        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .photo-card img:hover {
            transform: scale(1.03);
        }

        .photo-caption {
            padding: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .loading {
            text-align: center;
            color: var(--accent-gold);
            font-size: 1.2rem;
            padding: 50px 0;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Sai & Mao Sint</h1>
        <p>Our Wedding & Story Timeline</p>
    </header>

    <div class="container" id="timeline-container">
        <div class="loading">Loading our story...</div>
    </div>

    <footer>
        <p>Forever & Always</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://ejjqaxlwkbcfllggonff.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqanFheGx3a2JjZmxsZ2dvbmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA1OTAwNjEsImV4cCI6MjA1NjE2NjA2MX0.97bT-2s_K-32j2Y3VInO1C9I0Pqg1O-6s8x1y6z2G48';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchStory() {
            const container = document.getElementById('timeline-container');

            try {
                const { data: sections, error: secErr } = await db
                    .from('story_sections')
                    .select('*')
                    .order('section_order', { ascending: true });

                if (secErr) throw secErr;

                const { data: photos, error: photoErr } = await db
                    .from('section_photos')
                    .select('*')
                    .order('position_num', { ascending: true });

                if (photoErr) throw photoErr;

                container.innerHTML = '';

                if (!sections || sections.length === 0) {
                    container.innerHTML = '<div class="loading">No story sections found yet.</div>';
                    return;
                }

                sections.forEach(sec => {
                    const secPhotos = photos ? photos.filter(p => p.section_id === sec.id) : [];

                    let photosHTML = '';
                    if (secPhotos.length > 0) {
                        photosHTML = `<div class="photo-gallery">`;
                        secPhotos.forEach(p => {
                            photosHTML += `
                                <div class="photo-card">
                                    <img src="${p.image_url}" alt="${p.caption || 'Story Photo'}" loading="lazy">
                                    ${p.caption ? `<div class="photo-caption">${p.caption}</div>` : ''}
                                </div>
                            `;
                        });
                        photosHTML += `</div>`;
                    }

                    const sectionBlock = `
                        <div class="timeline-section">
                            <div class="section-header">
                                <h2 class="section-title">${sec.title || ''}</h2>
                                ${sec.subtitle ? `<div class="section-subtitle">${sec.subtitle}</div>` : ''}
                            </div>
                            ${sec.letter_text ? `<div class="letter-content">${sec.letter_text}</div>` : ''}
                            ${photosHTML}
                        </div>
                    `;

                    container.innerHTML += sectionBlock;
                });

            } catch (err) {
                container.innerHTML = `<div class="loading" style="color:#ff4d4d;">Error loading content: ${err.message}</div>`;
            }
        }

        fetchStory();
    </script>
</body>
</html>
