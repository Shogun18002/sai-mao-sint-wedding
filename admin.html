<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Story & Wedding Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0e17; color: #fffffe; font-family: 'Inter', sans-serif; padding: 20px; }
    
    /* Login Overlay */
    #login-modal { position: fixed; inset: 0; background: #0f0e17; z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .login-box { background: #16161a; padding: 40px; border-radius: 8px; border: 1px solid #72757e; width: 100%; max-width: 360px; text-align: center; }
    .login-box h2 { font-family: 'Cinzel', serif; color: #ff8906; margin-bottom: 20px; }
    
    input, textarea, select { width: 100%; padding: 12px; margin-bottom: 15px; background: #010101; border: 1px solid #72757e; color: #fff; border-radius: 4px; }
    button { width: 100%; padding: 12px; background: #ff8906; border: none; color: #fffffe; font-weight: 600; cursor: pointer; border-radius: 4px; transition: background 0.2s; }
    button:hover { background: #e57b00; }

    /* Dashboard UI */
    #dashboard { display: none; max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #72757e; padding-bottom: 20px; margin-bottom: 30px; }
    h1 { font-family: 'Cinzel', serif; color: #ff8906; }
    
    .card { background: #16161a; padding: 25px; border-radius: 8px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05); }
    .card h3 { color: #f25f4c; margin-bottom: 15px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  </style>
</head>
<body>

  <!-- LOGIN MODAL -->
  <div id="login-modal">
    <div class="login-box">
      <h2>Admin Access</h2>
      <input type="text" id="username" placeholder="Username" />
      <input type="password" id="password" placeholder="Password" />
      <button onclick="login()">Sign In</button>
      <div id="login-err" style="color: #f25f4c; margin-top: 10px; font-size: 0.85rem;"></div>
    </div>
  </div>

  <!-- DASHBOARD UI -->
  <div id="dashboard">
    <header>
      <h1>Story Content Manager</h1>
      <button onclick="logout()" style="width: auto; padding: 8px 16px; background: #f25f4c;">Logout</button>
    </header>

    <!-- SECTION & LETTER MANAGER -->
    <div class="card">
      <h3>Edit Section Letter & Details</h3>
      <select id="section-select" onchange="loadSectionDetails()">
        <option value="">Select Timeline Event...</option>
      </select>
      <input type="text" id="edit-title" placeholder="Event Title (e.g., 1st Anniversary)" />
      <input type="text" id="edit-subtitle" placeholder="Subtitle (e.g., One Year of Love)" />
      <textarea id="edit-letter" rows="4" placeholder="Write letter text here..."></textarea>
      <button onclick="saveSection()">Update Section Letter</button>
    </div>

    <!-- PHOTO MANAGER -->
    <div class="card">
      <h3>Upload / Add Photo to Section</h3>
      <select id="photo-section-select">
        <option value="">Select Section for Photo...</option>
      </select>
      <div class="grid-2">
        <input type="text" id="photo-url" placeholder="Photo Image URL (http://...)" />
        <input type="number" id="photo-order" placeholder="Photo Position (1-3 or 1-20)" />
      </div>
      <input type="text" id="photo-caption" placeholder="Photo Caption" />
      <button onclick="savePhoto()">Save Photo Slot</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ejjqaxlwkbcfllggonff.supabase.co";
    const SUPABASE_ANON_KEY = "PASTE_YOUR_ANON_KEY_HERE"; 
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let sectionsData = [];

    async function login() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      const { data, error } = await supabase.from('admin_users').select('*').eq('username', u).eq('password', p).single();

      if (data) {
        document.getElementById('login-modal').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        initDashboard();
      } else {
        document.getElementById('login-err').innerText = 'Invalid username or password';
      }
    }

    function logout() {
      location.reload();
    }

    async function initDashboard() {
      const { data } = await supabase.from('story_sections').select('*').order('section_order');
      if (data) {
        sectionsData = data;
        const s1 = document.getElementById('section-select');
        const s2 = document.getElementById('photo-section-select');
        
        const options = data.map(s => `<option value="${s.id}">${s.section_order}. ${s.title}</option>`).join('');
        s1.innerHTML += options;
        s2.innerHTML += options;
      }
    }

    function loadSectionDetails() {
      const id = document.getElementById('section-select').value;
      const sec = sectionsData.find(s => s.id === id);
      if (sec) {
        document.getElementById('edit-title').value = sec.title || '';
        document.getElementById('edit-subtitle').value = sec.subtitle || '';
        document.getElementById('edit-letter').value = sec.letter_text || '';
      }
    }

    async function saveSection() {
      const id = document.getElementById('section-select').value;
      if (!id) return alert('Select a section first!');

      await supabase.from('story_sections').update({
        title: document.getElementById('edit-title').value,
        subtitle: document.getElementById('edit-subtitle').value,
        letter_text: document.getElementById('edit-letter').value
      }).eq('id', id);

      alert('Section updated successfully!');
      initDashboard();
    }

    async function savePhoto() {
      const section_id = document.getElementById('photo-section-select').value;
      const photo_url = document.getElementById('photo-url').value;
      const caption = document.getElementById('photo-caption').value;
      const photo_order = parseInt(document.getElementById('photo-order').value) || 1;

      if (!section_id || !photo_url) return alert('Section and Photo URL are required!');

      await supabase.from('section_photos').insert([{ section_id, photo_url, caption, photo_order }]);
      alert('Photo added!');
      document.getElementById('photo-url').value = '';
      document.getElementById('photo-caption').value = '';
    }
  </script>
</body>
</html>
